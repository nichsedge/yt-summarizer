[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-summarizer"
version = "0.3.0"
requires-python = ">=3.14.7"
dependencies = [
    "openai>=3.6.0",
    "requests>=2.34.2",
    "tiktoken>=0.14.0",
    "youtube-transcript-api>=1.2.4",
]
description = "Generate AI-powered summaries from YouTube video subtitles"
readme = "README.md"
authors = [
    {name = "YouTube Summarizer Team"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["youtube", "summarizer", "ai", "transcript", "video"]

[project.urls]
Homepage = "https://github.com/nichsedge/yt-summarizer"
Repository = "https://github.com/nichsedge/yt-summarizer.git"
Documentation = "https://github.com/nichsedge/yt-summarizer#readme"
"Bug Tracker" = "https://github.com/nichsedge/yt-summarizer/issues"

[project.scripts]
yt-summarizer = "yt_summarizer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "black>=26.5.1",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "hatchling>=1.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "black>=26.5.1",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "hatchling>=1.32.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), and other rules
select = ["E", "F", "W", "I", "N", "B", "C90", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Long lines here are prompt template literals; wrapping would change the
# prompts sent to the model.
"yt_summarizer/config/settings.py" = ["E501"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "youtube_transcript_api.*",
    "requests.*",
    "tiktoken.*",
    "openai.*",
]
ignore_missing_imports = true
